raw_path: data/raw/NF-ToN-IoT-v3.csv
categorical_columns:
- IPV4_SRC_ADDR
- IPV4_DST_ADDR
confounders:
- IPV4_SRC_ADDR
- IPV4_DST_ADDR
- L4_SRC_PORT
- L4_DST_PORT
label_column: Label
benign_label: 0

autoencoder:
  latent_dim: 25
  hidden_dims:
